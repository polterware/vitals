[package]
name = "vitals-agent"
description = "The read-only metrics agent Vitals runs on the hosts it reaches over SSH."
# The agent's own version, sent in its hello; the wire protocol has its own number.
version = "2.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "vitals-agent"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
