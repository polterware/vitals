[package]
name = "vitals-app"
description = "Vitals: live metrics of the hosts you reach over SSH."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "vitals"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
polterware-ui.workspace = true
anyhow = "1"
base64 = "0.22"
futures = "0.3"
russh = "0.65"
russh-sftp = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
